name: Centrio CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test-server:
    name: Build & Validate Server
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Validate Server Syntax & Custom DSA Engine
        working-directory: ./server
        run: |
          node -e "require('./src/utils/lruCache'); require('./src/utils/trie'); console.log('DSA modules validated successfully!');"
          node --check server.js

  build-and-lint-client:
    name: Build & Validate Client
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Run Frontend Linter (Non-blocking)
        working-directory: ./client
        run: npm run lint --if-present || true
        continue-on-error: true

      - name: Build Vite Frontend Production Bundle
        working-directory: ./client
        run: npm run build

  docker-verify:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    needs: [build-and-test-server, build-and-lint-client]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: centrio/server:test

      - name: Build Client Docker Image (Dry Run)
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: centrio/client:test

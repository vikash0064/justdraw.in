version: '3.8'

services:
  mongodb:
    image: mongo:6-alpine
    container_name: centrio-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - centrio-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: centrio-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/centrio
      - CLIENT_URL=http://localhost:3000
      - JWT_SECRET=centrio-default-super-secret-key-replace-in-prod-2026
    depends_on:
      - mongodb
    volumes:
      - uploads_data:/app/uploads
    networks:
      - centrio-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: centrio-client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - centrio-network

volumes:
  mongo_data:
  uploads_data:

networks:
  centrio-network:
    driver: bridge
